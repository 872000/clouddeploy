[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clouddeploy"
version = "0.1.0"
description = "Package one containerized app and deploy it to Azure Container Apps or AWS ECS from a single config file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Parth Manchanda" }]
dependencies = [
    # PyYAML is optional: clouddeploy falls back to a built-in parser
    # for the YAML subset it needs when PyYAML is not installed.
    "PyYAML>=6.0",
]

[project.scripts]
clouddeploy = "clouddeploy.cli:main"

[tool.setuptools.packages.find]
include = ["clouddeploy*"]
